    <main> 
      <article> <h2>Short quiz about my website</h2> 
        <form action="mailto:your.email@example.com" method="post" enctype="text/plain">
          <p>1) Do you enjoy the website demo?</p>
          <label><input type="radio" name="Enjoy" value="Yes"> Yes</label>
          <label><input type="radio" name="Enjoy" value="No"> No</label>
          <p>2) Which parts did you like? (checkboxes)</p>
          <label><input type="checkbox" name="Like_Images" value="Images"> Images</label>
          <label><input type="checkbox" name="Like_Tables" value="Tables"> Tables</label>
          <label><input type="checkbox" name="Like_Forms" value="Forms"> Forms</label> 
          <p>3) Rate overall clarity (1-5)</p> 
          <select name="Rating">
            <option>1</option> 
            <option>2</option> 
            <option>3</option> 
            <option selected>4</option>
             <option>5</option>
             </select> <p>4) Any extra comments?</p> <textarea name="Comments" rows="4" cols="40"></textarea> 
             <p><button type="submit">Submit Questionnaire</button></p> 
            </form> 
          </article> 
        </main> 
        <footer> 
          <p>Thanks for trying the questionnaire!</p>
